<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" />
<title>StudyBuddy — Student Operating System</title>

<body>

<!-- SVG DEFS -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">S</div>
      <div>
        <div class="brand-name">StudyBuddy</div>
        <div class="brand-sub" id="levelBadge">Scholar I</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" title="Search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

    </div>
  </header>

  <!-- TABS -->
  <nav class="tabs" id="tabs"></nav>

  <!-- MAIN CONTENT -->
  <main id="main"></main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>

</html>
